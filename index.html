<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IntervaLoop Timer</title>
<link rel="icon" id="favicon" type="image/svg+xml" href="data:,">
<style>
  :root {
    --bg: #f4f5f7; --panel: #ffffff; --text: #1d2330; --sub: #6b7385;
    --line: #dde1e8; --track: #e6e9ef;
    --work: #ff7a45; --rest: #3aa5ff; --done: #34c07a;
    --btn: #1d2330; --btn-text: #fff;
    color-scheme: light;
  }
  /* 背景：自動ならブラウザの設定に合わせ、data-theme があればそれに従う */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #15181e; --panel: #1e222a; --text: #eef1f6; --sub: #9aa3b5;
      --line: #2f3542; --track: #2a2f3a; --btn: #eef1f6; --btn-text: #15181e;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #15181e; --panel: #1e222a; --text: #eef1f6; --sub: #9aa3b5;
    --line: #2f3542; --track: #2a2f3a; --btn: #eef1f6; --btn-text: #15181e;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
    font-family: "Segoe UI", "Yu Gothic UI", "Meiryo", sans-serif;
    display: flex; justify-content: center; padding: 24px 16px;
    overflow-x: hidden;   /* 念のため：どこかが少しはみ出しても、ページが横にスライドしないようにする */
  }
  .app { width: 100%; max-width: 440px; display: flex; flex-direction: column; gap: 18px; }

  /* 丸いバーと操作ボタン。全画面表示では、この部分だけを画面いっぱいに出す */
  .stage { position: relative; display: flex; flex-direction: column; gap: 18px; }
  .stage:fullscreen { --S: min(68vh, 90vw); background: var(--bg); justify-content: center; align-items: center; }
  .stage:fullscreen .ring-wrap { width: var(--S); height: var(--S); }
  .stage:fullscreen .center { inset: calc(var(--S) * .133); }
  .stage:fullscreen .time { font-size: calc(var(--S) * .18); }
  .stage:fullscreen .phase { font-size: calc(var(--S) * .05); }
  .stage:fullscreen .round { font-size: calc(var(--S) * .047); }
  .stage:fullscreen .controls { width: min(440px, 90vw); }
  .fs-exit { display: none; position: absolute; top: 12px; right: 12px; }
  .stage:fullscreen .fs-exit { display: block; }

  .ring-wrap { position: relative; width: 300px; height: 300px; margin: 0 auto; touch-action: none; }
  .ring-wrap svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring-wrap.active .track, .ring-wrap.active .bar { cursor: pointer; }
  .track { fill: none; stroke: var(--track); stroke-width: 16; }
  .bar { fill: none; stroke: var(--work); stroke-width: 16; stroke-linecap: round;
         transition: stroke .3s; }
  .ring-wrap.dragging .bar { transition: none; }
  .knob { fill: var(--panel); stroke: var(--work); stroke-width: 3; display: none; pointer-events: none; }
  .ring-wrap.active .knob { display: block; }
  .center { position: absolute; inset: 40px; display: flex; flex-direction: column;
            align-items: center; justify-content: center; gap: 6px; pointer-events: none; }
  .phase { font-size: 15px; font-weight: 600; letter-spacing: .05em; color: var(--work); }
  .time { font-size: 54px; font-weight: 300; font-variant-numeric: tabular-nums; }
  .round { font-size: 14px; color: var(--sub); }

  .controls { display: flex; gap: 10px; justify-content: center; }
  .controls button {
    flex: 1; max-width: 130px; padding: 12px 0; font-size: 16px; font-weight: 600;
    border-radius: 999px; border: 1px solid var(--line); cursor: pointer;
    background: var(--panel); color: var(--text);
  }
  .controls button.primary { background: var(--btn); color: var(--btn-text); border-color: var(--btn); }
  .controls button:disabled { opacity: .4; cursor: default; }

  /* 控えめな操作（時間送り・スキップ） */
  .sub-controls { display: flex; gap: 4px; justify-content: center; margin-top: -8px; }
  .sub-controls.hidden { visibility: hidden; }
  .ghost {
    background: none; border: none; color: var(--sub); font-size: 13px; padding: 4px 8px;
    border-radius: 6px; cursor: pointer; font-family: inherit;
  }
  .ghost:hover { background: var(--panel); color: var(--text); }
  .sep { width: 1px; background: var(--line); margin: 4px 6px; }
  .seek { display: flex; align-items: center; gap: 2px; }
  .seek input, .seek select {
    font: inherit; font-size: 13px; color: var(--text); background: var(--panel);
    border: 1px solid var(--line); border-radius: 6px; padding: 2px 4px;
  }
  .seek input { width: 48px; text-align: center; font-variant-numeric: tabular-nums; }

  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 16px;
           padding: 16px; display: flex; flex-direction: column; gap: 14px; }
  .panel-title { font-size: 12px; font-weight: 600; color: var(--sub); letter-spacing: .05em; margin-bottom: -4px; }
  .panel.locked .hms input { opacity: .5; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .label { font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 8px; white-space: nowrap; }
  .dot { width: 10px; height: 10px; border-radius: 50%; }
  .hms { display: flex; align-items: center; gap: 4px; }
  .hms input, .num {
    width: 52px; padding: 6px 4px; text-align: center; font-size: 16px;
    border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--text);
    font-variant-numeric: tabular-nums;
  }
  .hms span { font-size: 12px; color: var(--sub); margin-right: 4px; }
  /* スマホ幅：入力欄を少し細くして、項目名が1行に収まるようにする */
  @media (max-width: 420px) {
    .hms input, .num { width: 42px; font-size: 15px; }
    .hms span { margin-right: 2px; }
  }
  /* さらに狭い画面：余白と入力欄を詰める。それでも入らなければ折り返す */
  @media (max-width: 360px) {
    body { padding-left: 10px; padding-right: 10px; }
    .panel { padding: 12px; }
    .hms input, .num { width: 36px; }
    .volume input { width: 72px; }
    .row { flex-wrap: wrap; row-gap: 6px; }
    .row > .hms, .row > .volume { margin-left: auto; }
  }
  .hint { font-size: 12px; color: var(--sub); }
  .switch { display: flex; align-items: center; gap: 8px; font-size: 14px; cursor: pointer; }
  .switch input { width: 18px; height: 18px; accent-color: var(--work); }
  .volume { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--sub); }
  .volume input { width: 100px; accent-color: var(--work); cursor: pointer; }
  .volume #volumeVal { width: 34px; text-align: right; font-variant-numeric: tabular-nums; }
  .volume.off, .sound-row.off, .warn-row.off { opacity: .4; }
  .warn-row { justify-content: flex-start; margin-top: -6px; }
  .warn-row .num { width: 40px; margin: 0 4px; }
  .total { font-size: 12px; color: var(--sub); margin-top: -4px; }
  /* ⓘ マーク：マウスを乗せる（またはキーで選ぶ）と、説明の吹き出しを出す */
  .info { position: relative; display: inline-flex; align-items: center; justify-content: center; flex: 0 0 auto;
          width: 17px; height: 17px; border: 1px solid var(--sub); border-radius: 50%; color: var(--sub);
          font-size: 11px; font-weight: 600; font-style: normal; cursor: help; outline: none; }
  .info:hover, .info:focus-visible { color: var(--text); border-color: var(--text); }
  /* 吹き出しは、見えないときは場所も取らない（スマホで横にはみ出してスライドしないように）。
     開いたときに画面からはみ出す分は、JS で --dx だけずらす */
  .info .tip { position: absolute; bottom: calc(100% + 8px); left: 50%; transform: translateX(-70%);
               translate: var(--dx, 0px) 0; width: min(250px, calc(100vw - 24px));
               background: var(--btn); color: var(--btn-text); font-size: 12px; font-weight: 400; line-height: 1.55;
               padding: 8px 11px; border-radius: 8px; box-shadow: 0 4px 14px rgba(0,0,0,.25);
               white-space: normal;   /* 項目名の「折り返さない」設定を引き継がず、枠の中で折り返す */
               display: none; pointer-events: none; z-index: 5; }
  .info .tip::after { content: ''; position: absolute; top: 100%; left: calc(70% - var(--dx, 0px)); border: 6px solid transparent;
                      border-top-color: var(--btn); transform: translateX(-50%); }
  /* マウスを乗せる・タップして選ぶと、JS が位置を決めてから show を付けて出す */
  .info.show .tip { display: block; }
  /* 左寄りの項目では、吹き出しを右向きに開く */
  .info.open-right .tip { transform: translateX(-15%); }
  .info.open-right .tip::after { left: calc(15% - var(--dx, 0px)); }
  .label .info { margin-left: 2px; }
  .volume select {
    font: inherit; font-size: 13px; color: var(--text); background: var(--panel);
    border: 1px solid var(--line); border-radius: 6px; padding: 2px 4px; cursor: pointer;
  }
  .sound-row { margin-top: -6px; }

  /* お気に入り */
  .favs { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .chip {
    display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 999px;
    font-size: 12px; color: var(--sub); background: var(--bg); overflow: hidden;
  }
  .chip button { background: none; border: none; color: inherit; font: inherit; cursor: pointer; padding: 4px 4px 4px 10px; }
  .chip button.del { padding: 4px 8px 4px 4px; opacity: .6; }
  .chip button:hover { color: var(--text); opacity: 1; }
  /* 計測中は、呼び出しのボタンだけ押せない（登録と削除はできる） */
  .chip button:disabled { opacity: .45; cursor: default; }
  .fav-form { display: inline-flex; align-items: center; gap: 4px; flex-wrap: wrap; }
  .chip-ask { color: var(--text); }
  .chip-ask .ask-text { padding: 4px 4px 4px 10px; }
  .chip .ask-yes { color: #e5534b; font-weight: 600; }
  .fav-note { font-size: 12px; color: #e5534b; }
  .fav-form input { font: inherit; font-size: 13px; width: 170px; max-width: 100%; padding: 4px 8px;
                    border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--text); }

  /* 色の設定 */
  details { font-size: 13px; color: var(--sub); }
  summary { cursor: pointer; padding: 2px 4px; width: fit-content; }
  .colors { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; padding: 10px 4px 0; }
  .colors label { display: flex; align-items: center; gap: 6px; }
  .colors select {
    font: inherit; font-size: 13px; color: var(--text); background: var(--panel);
    border: 1px solid var(--line); border-radius: 6px; padding: 2px 4px; cursor: pointer;
  }
  .colors input[type=color] { width: 32px; height: 24px; border: 1px solid var(--line); border-radius: 6px; padding: 0; background: none; cursor: pointer; }
  .colors label { cursor: pointer; }
  /* 指で操作する端末（スマホ・タブレット）では、色のボタンを押しやすい大きさにする */
  @media (pointer: coarse) {
    .colors input[type=color] { width: 44px; height: 44px; border-radius: 10px; }
    .colors label { min-height: 44px; }
  }

  /* 下部（キー操作・言語） */
  .footer { display: flex; justify-content: space-between; align-items: center; margin-top: -8px; }
  .footer select {
    font: inherit; font-size: 13px; color: var(--sub); background: none;
    border: 1px solid var(--line); border-radius: 6px; padding: 2px 4px; cursor: pointer;
  }

  .logo { display: flex; justify-content: center; margin-top: 4px; }
  .logo svg { overflow: visible; }
  .logo text { font-size: 48px; font-weight: 600; fill: var(--text); letter-spacing: -1px; }
  .logo text.logo-sub { font-size: 15px; font-weight: 400; fill: var(--sub); letter-spacing: 4.5px; }
  .logo .hole { fill: transparent; }
  .logo-track { fill: none; stroke: var(--track); }
  .logo-arc { fill: none; stroke-linecap: round; }
  .credit { text-align: center; font-size: 11px; color: var(--sub); opacity: .7; margin-top: -6px; }

  /* キー操作の一覧 */
  .modal { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: flex;
           align-items: center; justify-content: center; padding: 16px; }
  .modal.hidden { display: none; }
  .modal-box { background: var(--panel); border: 1px solid var(--line); border-radius: 16px;
               padding: 20px; width: 100%; max-width: 380px; display: flex; flex-direction: column; gap: 12px; }
  .modal-title { font-weight: 600; }
  .modal table { border-collapse: collapse; font-size: 14px; }
  .modal td { padding: 5px 4px; border-bottom: 1px solid var(--line); }
  .modal td:first-child { white-space: nowrap; padding-right: 14px; }
  kbd { font-family: inherit; font-size: 12px; border: 1px solid var(--line); border-bottom-width: 2px;
        border-radius: 5px; padding: 1px 6px; background: var(--bg); }
  .modal-box .ghost { align-self: flex-end; }
  /* 数字入力の上下の三角（スピンボタン）を出さない。増減はキーボードの↑↓でできる */
  input[type=number] { -moz-appearance: textfield; appearance: textfield; }
  input[type=number]::-webkit-inner-spin-button,
  input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
</style>
</head>
<body>
<div class="app">
  <div class="stage" id="stage">
  <button class="ghost fs-exit" id="fsExit" data-i18n="fsExit"></button>
  <div class="ring-wrap" id="ring">
    <svg viewBox="0 0 200 200">
      <circle class="track" cx="100" cy="100" r="88"/>
      <circle class="bar" id="bar" cx="100" cy="100" r="88"/>
      <circle class="knob" id="knob" cx="188" cy="100" r="7"/>
    </svg>
    <div class="center">
      <div class="phase" id="phase"></div>
      <div class="time" id="time">00:00</div>
      <div class="round" id="round"></div>
    </div>
  </div>

  <div class="controls">
    <button class="primary" id="startBtn"></button>
    <button id="pauseBtn" disabled data-i18n="pause"></button>
    <button id="resetBtn" data-i18n="reset" data-i18n-title="resetTip"></button>
  </div>

  <div class="sub-controls hidden" id="subControls">
    <button class="ghost" id="restartBtn" data-i18n="restart" data-i18n-title="restartTip"></button>
    <span class="sep"></span>
    <div class="seek">
      <button class="ghost" data-dir="-1" data-i18n-title="backTip">◀</button>
      <input type="number" inputmode="numeric" min="1" max="999" id="seekAmount">
      <select id="seekUnit">
        <option value="1" data-i18n="unitS"></option>
        <option value="60" data-i18n="unitM"></option>
        <option value="3600" data-i18n="unitH"></option>
      </select>
      <button class="ghost" data-dir="1" data-i18n-title="fwdTip">▶</button>
    </div>
    <span class="sep"></span>
    <button class="ghost" id="skipBtn" data-i18n="skip" data-i18n-title="skipTip"></button>
  </div>
  </div>

  <div class="panel" id="panel">
    <div class="panel-title" data-i18n="timePanel"></div>
    <div class="favs" id="favs"></div>
    <div class="row">
      <div class="label"><span class="dot" style="background:var(--work)"></span><span data-i18n="work"></span></div>
      <div class="hms" data-key="work">
        <input type="number" inputmode="numeric" min="0" max="99" data-u="h"><span data-i18n="h"></span>
        <input type="number" inputmode="numeric" min="0" max="59" data-u="m"><span data-i18n="m"></span>
        <input type="number" inputmode="numeric" min="0" max="59" data-u="s"><span data-i18n="s"></span>
      </div>
    </div>
    <div class="row">
      <div class="label"><span class="dot" style="background:var(--rest)"></span><span data-i18n="rest"></span><span class="info open-right" tabindex="0">i<span class="tip" role="tooltip" data-i18n="tipRest"></span></span></div>
      <div class="hms" data-key="rest">
        <input type="number" inputmode="numeric" min="0" max="99" data-u="h"><span data-i18n="h"></span>
        <input type="number" inputmode="numeric" min="0" max="59" data-u="m"><span data-i18n="m"></span>
        <input type="number" inputmode="numeric" min="0" max="59" data-u="s"><span data-i18n="s"></span>
      </div>
    </div>
    <div class="row">
      <div class="label"><span data-i18n="repeat"></span><span class="info open-right" tabindex="0">i<span class="tip" role="tooltip" data-i18n="tipRepeat"></span></span></div>
      <div class="hms"><input class="num" type="number" inputmode="numeric" min="0" max="999" id="repeat"><span data-i18n="times"></span></div>
    </div>
    <div class="row">
      <div class="label"><span class="dot" style="background:var(--sub)"></span><span data-i18n="countdown"></span><span class="info open-right" tabindex="0">i<span class="tip" role="tooltip" data-i18n="tipCountdown"></span></span></div>
      <div class="hms"><input class="num" type="number" inputmode="numeric" min="0" max="10" id="countdown"><span data-i18n="s"></span></div>
    </div>
    <div class="total" id="total"></div>
  </div>

  <div class="panel" id="soundPanel">
    <div class="panel-title" data-i18n="soundPanel"></div>
    <div class="row">
      <label class="switch"><input type="checkbox" id="seOn"><span data-i18n="se"></span></label>
      <label class="volume"><span data-i18n="volume"></span>
        <input type="range" min="0" max="100" step="5" id="volume"><span id="volumeVal"></span></label>
    </div>
    <div class="row sound-row">
      <label class="volume"><span data-i18n="soundType"></span>
        <select id="soundSel">
          <option value="simple" data-i18n="sndSimple"></option>
          <option value="pon" data-i18n="sndPon"></option>
          <option value="pipipi" data-i18n="sndPipipi"></option>
          <option value="whistle" data-i18n="sndWhistle"></option>
          <option value="chime" data-i18n="sndChime"></option>
          <option value="bell" data-i18n="sndBell"></option>
          <option value="xylo" data-i18n="sndXylo"></option>
          <option value="buzzer" data-i18n="sndBuzzer"></option>
        </select></label>
      <button class="ghost" id="previewBtn" data-i18n="previewAll" data-i18n-title="previewTip"></button>
    </div>
    <div class="row warn-row">
      <label class="switch"><input type="checkbox" id="warnOn"><span><span data-i18n="warnPre"></span><input class="num" type="number" inputmode="numeric" min="1" max="30" id="warnSec"><span data-i18n="warnPost"></span></span></label>
      <span class="info" tabindex="0" aria-describedby="warnTip">i<span class="tip" role="tooltip" id="warnTip"></span></span>
    </div>
  </div>

  <details>
    <summary data-i18n="colors"></summary>
    <div class="colors">
      <label><input type="color" data-color="work"><span data-i18n="work"></span></label>
      <label><input type="color" data-color="rest"><span data-i18n="rest"></span></label>
      <label><input type="color" data-color="done"><span data-i18n="doneColor"></span></label>
      <button class="ghost" id="colorReset" data-i18n="colorReset"></button>
    </div>
    <div class="colors">
      <span data-i18n="theme"></span>
      <select id="themeSel">
        <option value="auto" data-i18n="themeAuto"></option>
        <option value="light" data-i18n="themeLight"></option>
        <option value="dark" data-i18n="themeDark"></option>
      </select>
    </div>
  </details>

  <div class="footer">
    <div>
      <button class="ghost" id="helpBtn" data-i18n="keysLink"></button>
      <button class="ghost" id="fsBtn" data-i18n="fullscreen" data-i18n-title="fullscreenTip"></button>
    </div>
    <select id="langSel" aria-label="Language">
      <option value="ja">日本語</option>
      <option value="en">English</option>
    </select>
  </div>
  <div class="logo">
    <svg id="logoSvg" role="img" aria-label="IntervaLoop Timer">
      <text x="0" y="48">Interva<tspan>L</tspan><tspan class="hole">o</tspan><tspan class="hole">o</tspan>p</text>
      <g class="logo-rings"></g>
      <text class="logo-sub" y="80" text-anchor="middle">TIMER</text>
    </svg>
  </div>
  <div class="credit" data-i18n="credit"></div>
</div>

<div class="modal hidden" id="help">
  <div class="modal-box">
    <div class="modal-title" data-i18n="keysTitle"></div>
    <table id="keyTable"></table>
    <div class="hint" data-i18n="keysNote"></div>
    <button class="ghost" id="helpClose" data-i18n="close"></button>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const bar = $('bar'), knob = $('knob'), ring = $('ring');
const R = 88, CIRC = 2 * Math.PI * R;
bar.style.strokeDasharray = CIRC;

// ---- 設定 ----
const defaultColors = { work: '#ff7a45', rest: '#3aa5ff', done: '#34c07a' };
const defaults = { work: 25 * 60, rest: 5 * 60, repeat: 4, countdown: 3, se: true, volume: 70, sound: 'simple',
                   warnSound: true, warnSec: 5, colors: { ...defaultColors }, favorites: [] };
let settings = { ...defaults };
try { Object.assign(settings, JSON.parse(localStorage.getItem('intervalTimer') || '{}')); } catch (e) {}
settings.colors = { ...defaultColors, ...settings.colors };

// 残り何秒で合図するか（1〜30秒）
const warnSec = () => Math.min(30, Math.max(1, settings.warnSec || 5));

// ---- 言語 ----
// 言語を増やすときは、ここに同じキーを持つ表を1つ追加し、#langSel に option を足す
const I18N = {
  ja: {
    appTitle: 'IntervaLoop Timer',
    start: '開始', resume: '再開', pause: '一時停止', reset: 'リセット', resetTip: 'リセット（Shift+R）',

let lang = settings.lang || ((navigator.language || '').toLowerCase().startsWith('ja') ? 'ja' : 'en');
if (!I18N[lang]) lang = 'en';
const t = (key, params = {}) =>
  String(I18N[lang][key] ?? I18N.en[key] ?? key).replace(/\{(\w+)\}/g, (_, k) => params[k]);
const short = sec => I18N[lang].dur(Math.floor(sec / 3600), Math.floor(sec % 3600 / 60), sec % 60);

function applyLang() {
  document.documentElement.lang = lang;
  $('langSel').value = lang;
  document.querySelectorAll('[data-i18n]').forEach(el => el.textContent = t(el.dataset.i18n));
  document.querySelectorAll('[data-i18n-title]').forEach(el => el.title = t(el.dataset.i18nTitle));
  $('keyTable').innerHTML = '';
  I18N[lang].keys.forEach(([k, desc]) => {
    const tr = $('keyTable').insertRow();
    tr.insertCell().innerHTML = k.split(' / ').map(x => `<kbd>${x}</kbd>`).join(' / ');
    tr.insertCell().textContent = desc;
  });
  updateWarnInfo();
  showTotal();
}

function save() {
  try { localStorage.setItem('intervalTimer', JSON.stringify(settings)); } catch (e) {}
}
function setHms(key, total) {
  const box = document.querySelector(`.hms[data-key="${key}"]`);
  box.querySelector('[data-u=h]').value = Math.floor(total / 3600);
  box.querySelector('[data-u=m]').value = Math.floor(total % 3600 / 60);
  box.querySelector('[data-u=s]').value = total % 60;
}
function getHms(key) {
  const box = document.querySelector(`.hms[data-key="${key}"]`);
  const v = u => Math.max(0, parseInt(box.querySelector(`[data-u=${u}]`).value, 10) || 0);
  return v('h') * 3600 + v('m') * 60 + v('s');
}
function readSettings() {
  settings.work = getHms('work');
  settings.rest = getHms('rest');
  settings.repeat = Math.max(0, parseInt($('repeat').value, 10) || 0);
  settings.countdown = Math.min(10, Math.max(0, parseInt($('countdown').value, 10) || 0));
  settings.se = $('seOn').checked;
  settings.volume = +$('volume').value;
  settings.sound = $('soundSel').value;
  settings.warnSound = $('warnOn').checked;
  settings.warnSec = Math.min(30, Math.max(1, parseInt($('warnSec').value, 10) || 5));
  showVolume();
  showTotal();
  save();
}
function showVolume() {
  $('volumeVal').textContent = settings.volume + '%';
  document.querySelectorAll('.volume, .sound-row, .warn-row').forEach(el => el.classList.toggle('off', !settings.se));
}
// 合計時間（インターバルは最後のワークタイムの後には入らない）。開始前のカウントダウンも足す。
// 止めるまで繰り返すときは、1回あたりの時間（カウントダウンは最初だけなので含めない）
function showTotal() {
  const { work, rest, repeat, countdown } = settings;
  const cd = countdown > 0 ? t('totalCd', { sec: short(countdown) }) : '';
  $('total').textContent = repeat > 0
    ? t('total', { n: repeat, cd, time: short(countdown + work * repeat + rest * (repeat - 1)) })
    : t('totalInf', { time: short(work + rest) });
}
// ⓘ の説明は、今の秒数を例にして表示する
function updateWarnInfo() {
  $('warnTip').textContent = t('warnInfo', { s: warnSec(), d: warnSec() * 2 });
}
function writeInputs() {
  setHms('work', settings.work);
  setHms('rest', settings.rest);
  $('repeat').value = settings.repeat;
  $('countdown').value = settings.countdown;
  $('seOn').checked = settings.se;
  $('volume').value = settings.volume;
  $('soundSel').value = settings.sound;
  if (!$('soundSel').value) $('soundSel').value = settings.sound = 'simple';
  $('warnOn').checked = settings.warnSound;
  $('warnSec').value = warnSec();
  showVolume();
  showTotal();
}
writeInputs();

// ---- お気に入り ----
const MAX_FAVS = 9;   // キーの1〜9で呼び出せる数に合わせる
function renderFavs() {
  const box = $('favs');
  box.innerHTML = '';
  settings.favorites.forEach((f, i) => {
    const chip = document.createElement('span');
    chip.className = 'chip';
    const load = document.createElement('button');
    load.textContent = f.name;
    load.title = (i < 9 ? `[${i + 1}] ` : '') +
      t('favTip', { work: short(f.work), rest: short(f.rest), repeat: f.repeat || '∞' });
    load.onclick = () => loadFav(i);
    const del = document.createElement('button');
    del.className = 'del'; del.textContent = '×'; del.title = t('favDel');
    del.onclick = () => askDelete(chip, f.name, () => {
      settings.favorites.splice(i, 1); save(); renderFavs();
    });
    chip.append(load, del);
    box.append(chip);
  });
  const add = document.createElement('button');
  add.className = 'ghost'; add.textContent = t('favAdd');
  add.onclick = () => {
    if (settings.favorites.length >= MAX_FAVS) { favNote(add, t('favFull')); return; }
    readSettings();
    const { work, rest, repeat } = settings;
    const def = `${short(work)}/${short(rest)}×${repeat || '∞'}`;
    openFavForm(add, def, name => {
      settings.favorites.push({ name, work, rest, repeat });
      save(); renderFavs();
    });
  };
  box.append(add);
  lockFavs();
}
// 名前の入力欄をページの中に出す（ブラウザの入力ダイアログはページの動きを止めてしまい、
// 計測中だと区切りの音が鳴らなくなるため）
function openFavForm(add, def, onSave) {
  const form = document.createElement('span');
  form.className = 'fav-form';
  const inp = document.createElement('input');
  inp.type = 'text'; inp.value = def; inp.maxLength = 40;
  inp.placeholder = t('favName'); inp.setAttribute('aria-label', t('favName'));
  const ok = document.createElement('button');
  ok.type = 'button'; ok.className = 'ghost'; ok.textContent = t('favSave');
  const cancel = document.createElement('button');
  cancel.type = 'button'; cancel.className = 'ghost'; cancel.textContent = t('favCancel');
  const done = keep => keep ? onSave(inp.value.trim() || def) : renderFavs();
  ok.onclick = () => done(true);
  cancel.onclick = () => done(false);
  inp.onkeydown = e => {
    if (e.key === 'Enter') { e.preventDefault(); done(true); }
    else if (e.key === 'Escape') { e.preventDefault(); done(false); }
  };
  form.append(inp, ok, cancel);
  add.replaceWith(form);
  inp.focus(); inp.select();
}
// 削除の確認も、ページの中で行う（ブラウザの確認ダイアログは、計測中のタイマーを止めてしまうため）。
// しばらく押さなければ、元の表示に戻す
function askDelete(chip, name, onYes) {
  const ask = document.createElement('span');
  ask.className = 'chip chip-ask';
  const msg = document.createElement('span');
  msg.className = 'ask-text'; msg.textContent = t('favDelAsk', { name });
  const yes = document.createElement('button');
  yes.type = 'button'; yes.className = 'ask-yes'; yes.textContent = t('favDelYes');
  const no = document.createElement('button');
  no.type = 'button'; no.textContent = t('favDelNo');
  const timer = setTimeout(() => renderFavs(), 6000);
  yes.onclick = () => { clearTimeout(timer); onYes(); };
  no.onclick = () => { clearTimeout(timer); renderFavs(); };
  ask.append(msg, yes, no);
  chip.replaceWith(ask);
  no.focus();
}
// 短いお知らせを、ボタンの横に数秒だけ出す（ブラウザのダイアログの代わり）
function favNote(after, text) {
  document.querySelector('#favs .fav-note')?.remove();
  const note = document.createElement('span');
  note.className = 'fav-note'; note.textContent = text; note.setAttribute('role', 'status');
  after.after(note);
  setTimeout(() => note.remove(), 3000);
}
// 計測中は、お気に入りの呼び出しだけできないようにする
function lockFavs() {
  document.querySelectorAll('#favs .chip:not(.chip-ask) button:not(.del)').forEach(b => b.disabled = active());
}
function loadFav(i) {
  const f = settings.favorites[i];
  if (!f || active()) return;
  Object.assign(settings, { work: f.work, rest: f.rest, repeat: f.repeat });
  writeInputs(); save();
  if (state === 'done') state = 'idle';
  render();
}

// ---- 効果音（Web Audioで生成） ----
let ctx = null;
// vol：音ごとの大きさの補正、hold：鳴らし続ける長さ（ブザーなど）
function tone(freq, start, dur, { type = 'sine', vol = 1, hold = 0 } = {}) {
  const o = ctx.createOscillator(), g = ctx.createGain();
  o.type = type; o.frequency.value = freq;
  const t = ctx.currentTime + start;
  const peak = Math.max(0.0011, 0.45 * settings.volume / 100 * vol);   // 音量100%で0.45
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(peak, t + 0.01);
  if (hold > 0) g.gain.setValueAtTime(peak, t + hold);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g).connect(ctx.destination);
  o.start(t); o.stop(t + dur + 0.05);
}

// 音色の部品
const pon = (f, s, d) => { tone(f, s, d); tone(f * 2, s, d * 0.5, { vol: 0.2 }); };
const beeps = (groups, f = 1500) => {            // 「ピピピ」を groups 回
  for (let g = 0; g < groups; g++)
    for (let i = 0; i < 3; i++)
      tone(f, g * 0.6 + i * 0.12, 0.09, { type: 'square', vol: 0.2, hold: 0.07 });
};
const chime = (f, s, d = 1.6) => {
  tone(f, s, d, { vol: 0.8 }); tone(f * 2, s, d * 0.6, { vol: 0.25 }); tone(f * 3, s, d * 0.3, { vol: 0.1 });
};
const bell = (f, s, d) => {                      // 倍音をずらして金属っぽく
  tone(f, s, d, { vol: 0.7 }); tone(f * 2.76, s, d * 0.45, { vol: 0.3 }); tone(f * 5.4, s, d * 0.25, { vol: 0.15 });
};
const xylo = (f, s) => { tone(f, s, 0.45, { vol: 0.9 }); tone(f * 4, s, 0.12, { vol: 0.2 }); };
// ホイッスル：高い音を細かく震わせる（玉が転がる音）。立ち上がりと切れ目を短くしてキレを出す
const whistle = (s, len, f = 2800) => {
  const t = ctx.currentTime + s;
  const peak = Math.max(0.0011, 0.45 * settings.volume / 100 * 0.4);
  const o = ctx.createOscillator(), g = ctx.createGain();
  const lfo = ctx.createOscillator(), depth = ctx.createGain();
  o.frequency.value = f;
  lfo.frequency.value = 30; depth.gain.value = f * 0.06;
  lfo.connect(depth).connect(o.frequency);
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(peak, t + 0.005);
  g.gain.setValueAtTime(peak, t + len - 0.015);
  g.gain.linearRampToValueAtTime(0.0001, t + len);
  o.connect(g).connect(ctx.destination);
  [o, lfo].forEach(n => { n.start(t); n.stop(t + len + 0.05); });
};
const buzz = (s, len) => {
  tone(150, s, len, { type: 'sawtooth', vol: 0.45, hold: len - 0.05 });
  tone(151.5, s, len, { type: 'square', vol: 0.2, hold: len - 0.05 });
};

  bell: {
    start:  () => bell(1318, 0, 1.5),
    switch: () => bell(1568, 0, 1.2),
    end:    () => bell(988, 0, 2),
    finish: () => { bell(1318, 0, 1.5); bell(988, 0.7, 2.5); },
  },
  xylo: {
    start:  () => { xylo(784, 0); xylo(1046, 0.12); },
    switch: () => { xylo(1046, 0); xylo(1046, 0.15); },
    end:    () => { xylo(1046, 0); xylo(784, 0.12); },
    finish: () => { xylo(523, 0); xylo(659, 0.12); xylo(784, 0.24); xylo(1046, 0.36); },
  },
  buzzer: {
    start:  () => buzz(0, 0.15),
    switch: () => buzz(0, 0.3),
    end:    () => buzz(0, 0.6),
    finish: () => { buzz(0, 0.4); buzz(0.6, 0.8); },
  },
};

const soundOn = () => settings.se && settings.volume > 0;
function ensureCtx() {
  ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
  if (ctx.state === 'suspended') ctx.resume();
}
function se(kind) {
  if (!soundOn()) return;
  ensureCtx();
  (SOUNDS[settings.sound] || SOUNDS.simple)[kind]();
}
// カウントダウンや残り数秒の合図に使う、短い「ッ」という音
function beep(freq) {
  if (!soundOn()) return;
  ensureCtx();
  tone(freq, 0, 0.07, { vol: 0.35 });
}

// 試聴：開始 → 区切り → 終了 → 最後 を順番に鳴らす
let previewTimers = [];
function previewAll() {
  previewTimers.forEach(clearTimeout);
  previewTimers = ['start', 'switch', 'end', 'finish'].map((k, i) => setTimeout(() => se(k), i * 2500));
}

// ---- タイマー本体 ----
let state = 'idle';       // idle / running / paused / done
let phase = 'work';       // ready（開始前のカウントダウン）/ work / rest
let round = 1;
let phaseLen = 0;         // 今のフェーズの長さ（ミリ秒）
let endAt = 0;            // 終わる時刻（running中）
let remain = 0;           // 残り（paused中）
let timerId = null;
let dragging = false;
let lastBeep = null;      // 最後に合図を鳴らした「残り秒数」

const fmt = ms => {
  const t = Math.ceil(ms / 1000);
  const h = Math.floor(t / 3600), m = Math.floor(t % 3600 / 60), s = t % 60;
  const p = n => String(n).padStart(2, '0');
  return h > 0 ? `${h}:${p(m)}:${p(s)}` : `${p(m)}:${p(s)}`;
};

const active = () => state === 'running' || state === 'paused';
const getLeft = () => state === 'running' ? Math.max(0, endAt - Date.now()) : remain;
function setLeft(ms) {
  ms = Math.min(phaseLen, Math.max(0, ms));
  if (state === 'running') endAt = Date.now() + ms; else remain = ms;
}
// 残り数秒の合図を出すか（短いワークタイムでは出さない）
const warnable = () => phase === 'work' && phaseLen >= warnSec() * 2000;

function render() {
  let left, total, label, color;
  if (state === 'idle') {
    left = total = settings.work * 1000; label = t('ready'); color = 'var(--work)';
  } else if (state === 'done') {
    left = 0; total = 1; label = t('done'); color = 'var(--done)';
  } else {
    left = getLeft();
    total = phaseLen;
    label = t(phase === 'work' ? 'phaseWork' : phase === 'rest' ? 'phaseRest' : 'getReady') + (state === 'paused' ? t('paused') : '');
    color = phase === 'work' ? 'var(--work)' : phase === 'rest' ? 'var(--rest)' : 'var(--sub)';
    // 残り数秒になったら、終了の色にして知らせる
    if (warnable() && left <= warnSec() * 1000) color = 'var(--done)';
  }
  const elapsed = total > 0 ? 1 - left / total : 1;
  bar.style.strokeDashoffset = -CIRC * elapsed;  // 経過した分だけ12時側からバーが減る
  bar.style.stroke = color;
  // つまみは残りバーの先端（＝経過位置）に置く
  const a = elapsed * 2 * Math.PI;
  knob.setAttribute('cx', 100 + R * Math.cos(a));
  knob.setAttribute('cy', 100 + R * Math.sin(a));
  knob.style.stroke = color;
  $('phase').textContent = label;
  $('phase').style.color = color;
  // カウントダウン中は「3、2、1」と数字だけを出す
  $('time').textContent = active() && phase === 'ready' ? Math.max(1, Math.ceil(left / 1000)) : fmt(left);
  $('round').textContent = state === 'idle' ? '' :
    settings.repeat > 0 ? t('roundOf', { n: Math.min(round, settings.repeat), total: settings.repeat })
                        : t('roundN', { n: round });
  document.title = active() ? `${fmt(left)} ${label}` : t('appTitle');

  $('startBtn').disabled = state === 'running';
  $('startBtn').textContent = t(state === 'paused' ? 'resume' : 'start');
  $('pauseBtn').disabled = state !== 'running';
  $('panel').classList.toggle('locked', active());
  // 計測中は、ワークタイム・インターバル・回数・カウントダウンを変えられないようにする
  $('panel').querySelectorAll('.hms input').forEach(inp => inp.disabled = active());
  lockFavs();
  $('subControls').classList.toggle('hidden', !active());
  ring.classList.toggle('active', active());
  updateLogo(elapsed);
}

// ---- ロゴ（o を丸いバーの形に） ----
const logoRings = [];
function buildLogo() {
  const svg = $('logoSvg'), text = svg.querySelector('text'), g = svg.querySelector('.logo-rings');
  const fs = 48, base = 48, ns = 'http://www.w3.org/2000/svg';
  const b = text.getBBox();
  if (!b.width) return;                     // 表示されていないときは作らない
  // 「TIMER」を文字ロゴの中央の下に置く（字間の分だけ右にずらして中央に見せる）
  svg.querySelector('.logo-sub').setAttribute('x', b.x + b.width / 2 + 2.25);
  const h = 86 - b.y;                       // 文字ロゴの上端から「TIMER」の下まで
  svg.setAttribute('viewBox', `${b.x - 2} ${b.y} ${b.width + 4} ${h}`);
  const scale = 44 / b.height;              // 文字ロゴの高さを44pxにする
  svg.style.height = (h * scale) + 'px';
  svg.style.width = ((b.width + 4) * scale) + 'px';
  g.innerHTML = '';
  logoRings.length = 0;
  ['var(--work)', 'var(--rest)'].forEach((color, i) => {
    const e = text.getExtentOfChar(8 + i);   // 「IntervaL」の次の o、o
    const cx = e.x + e.width / 2, cy = base - fs * 0.26, r = e.width * 0.36, c = 2 * Math.PI * r;
    const ring = cls => {
      const el = document.createElementNS(ns, 'circle');
      el.setAttribute('cx', cx); el.setAttribute('cy', cy); el.setAttribute('r', r);
      el.setAttribute('class', cls); el.setAttribute('stroke-width', fs * 0.1);
      g.appendChild(el);
      return el;
    };
    ring('logo-track');
    const arc = ring('logo-arc');
    arc.style.stroke = color;
    arc.style.strokeDasharray = `${c} ${c}`;
    arc.setAttribute('transform', `rotate(-90 ${cx} ${cy})`);
    logoRings.push({ arc, c });
  });
}
// 画面内に見えているか（一部でも入っていれば見えている扱い）
const onScreen = el => {
  const r = el.getBoundingClientRect();
  return r.bottom > 0 && r.top < innerHeight;
};
// 輪の残り（0〜1）を、丸いバーと同じく12時側から減らして表示する。
// 時間表示とロゴが同時に見えているときは、気が散らないようロゴは動かさない
function updateLogo(elapsed) {
  if (logoRings.length < 2) return;
  let left = [0.75, 0.4];                   // 止まっているときの形
  const linked = active() && !(onScreen(ring) && onScreen($('logoSvg')));
  if (linked) left = phase === 'work' ? [1 - elapsed, 1] : phase === 'rest' ? [1, 1 - elapsed] : [1, 1];
  else if (state === 'done') left = [1, 1];
  logoRings.forEach(({ arc, c }, i) => arc.style.strokeDashoffset = -c * (1 - left[i]));
  // 残り秒数になったら、ワークタイムの輪も丸いバーと同じ色にする（ロゴが動いているときだけ）
  const warnNow = linked && warnable() && getLeft() <= warnSec() * 1000;
  logoRings[0].arc.style.stroke = warnNow ? 'var(--done)' : 'var(--work)';
}

function beginPhase(p) {
  phase = p;
  phaseLen = (p === 'work' ? settings.work : p === 'rest' ? settings.rest : settings.countdown) * 1000;
  lastBeep = null;
  if (state === 'running') endAt = Date.now() + phaseLen; else remain = phaseLen;
}

// 今のフェーズを終えて次へ進む
function nextPhase() {
  if (phase === 'ready') {
    beginPhase('work'); se('start');
  } else if (phase === 'work') {
    const last = settings.repeat > 0 && round >= settings.repeat;
    if (last) { finish(); return; }
    if (settings.rest > 0) { se('end'); beginPhase('rest'); }
    else { se('switch'); round++; beginPhase('work'); }   // インターバルなしは区切り音1回だけ
  } else {
    round++; beginPhase('work'); se('start');
  }
  render();
}

function tick() {
  if (state !== 'running' || dragging) return;
  const left = endAt - Date.now();
  if (left <= 0) { nextPhase(); return; }
  const s = Math.ceil(left / 1000);
  // カウントダウン中は毎秒、ワークタイムの残り数秒も毎秒、短い音で知らせる
  if (phase === 'ready' && s !== lastBeep) { lastBeep = s; beep(880); }
  if (warnable() && s <= warnSec() && s !== lastBeep) { lastBeep = s; if (settings.warnSound) beep(1320); }
  render();
}

function finish() {
  state = 'done'; clearInterval(timerId); se('finish'); render();
}

$('startBtn').onclick = () => {
  if (state === 'paused') {
    endAt = Date.now() + remain;
    state = 'running';
    if (phase !== 'ready') se('start');
  } else {
    readSettings();
    if (settings.work <= 0) { alert(t('needWork')); return; }
    round = 1; state = 'running';
    if (settings.countdown > 0) { beginPhase('ready'); ensureCtx(); }
    else { beginPhase('work'); se('start'); }
  }
  clearInterval(timerId); timerId = setInterval(tick, 100);
  tick();
  render();
};
$('pauseBtn').onclick = () => {
  remain = getLeft();
  state = 'paused'; clearInterval(timerId); render();
};
$('resetBtn').onclick = () => {
  state = 'idle'; clearInterval(timerId); round = 1; render();
};

// ---- 時間送り・巻き戻し・スキップ ----
function seek(sec) {
  if (!active()) return;
  setLeft(getLeft() - sec * 1000);
  if (state === 'paused' && remain <= 0) { nextPhase(); return; }
  tick(); render();
}
// 送る量（N と単位）は設定として覚えておく
$('seekAmount').value = settings.seekAmount || 10;
$('seekUnit').value = settings.seekUnit || '1';
const seekStep = () => Math.max(1, parseInt($('seekAmount').value, 10) || 1) * +$('seekUnit').value;
['seekAmount', 'seekUnit'].forEach(id => $(id).addEventListener('change', () => {
  settings.seekAmount = Math.max(1, parseInt($('seekAmount').value, 10) || 1);
  settings.seekUnit = $('seekUnit').value;
  $('seekAmount').value = settings.seekAmount;
  save();
}));
document.querySelectorAll('[data-dir]').forEach(b => b.onclick = () => seek(+b.dataset.dir * seekStep()));
$('restartBtn').onclick = () => { if (active()) { setLeft(phaseLen); lastBeep = null; render(); } };
$('skipBtn').onclick = () => { if (active()) nextPhase(); };

// バーをクリック／ドラッグして位置を決める（秒単位）
let lastFrac = 0;
function fracFromPointer(e) {
  const r = ring.getBoundingClientRect();
  const x = e.clientX - (r.left + r.width / 2), y = e.clientY - (r.top + r.height / 2);
  let f = Math.atan2(x, -y) / (2 * Math.PI);   // 12時の位置から時計回りに 0〜1
  return f < 0 ? f + 1 : f;
}
function onBand(e) {
  const r = ring.getBoundingClientRect();
  const x = e.clientX - (r.left + r.width / 2), y = e.clientY - (r.top + r.height / 2);
  const d = Math.hypot(x, y) / (r.width / 2) * 100;   // viewBox座標に換算
  return d > 70 && d < 106;
}
function seekToFrac(f) {
  // 12時をまたいで一気に飛ばないようにする
  if (dragging && Math.abs(f - lastFrac) > 0.5) f = lastFrac > 0.5 ? 1 : 0;
  lastFrac = f;
  const totalSec = phaseLen / 1000;
  const elapsedSec = Math.round(f * totalSec);
  setLeft((totalSec - elapsedSec) * 1000);
  render();
}
ring.addEventListener('pointerdown', e => {
  if (!active() || !onBand(e)) return;
  dragging = true; ring.classList.add('dragging');
  ring.setPointerCapture(e.pointerId);
  lastFrac = fracFromPointer(e);
  seekToFrac(lastFrac);
});
ring.addEventListener('pointermove', e => { if (dragging) seekToFrac(fracFromPointer(e)); });
const endDrag = () => {
  if (!dragging) return;
  dragging = false; ring.classList.remove('dragging');
  if (getLeft() <= 0) nextPhase();
};
ring.addEventListener('pointerup', endDrag);
ring.addEventListener('pointercancel', endDrag);

// ---- キー操作の一覧 ----
const toggleHelp = show => $('help').classList.toggle('hidden', !show);
$('helpBtn').onclick = () => toggleHelp(true);
$('helpClose').onclick = () => toggleHelp(false);
$('help').addEventListener('click', e => { if (e.target === $('help')) toggleHelp(false); });

// ---- 全画面表示（丸いバーと操作ボタンだけを大きく出す） ----
const toggleFullscreen = () => {
  if (document.fullscreenElement) document.exitFullscreen();
  else $('stage').requestFullscreen?.();
};
$('fsBtn').onclick = toggleFullscreen;
$('fsExit').onclick = toggleFullscreen;
// 全画面に対応していないブラウザ（iPhoneのSafariなど）では、ボタンを出さない
if (!document.fullscreenEnabled) $('fsBtn').hidden = true;

// ---- キー操作 ----
// ⓘ の吹き出し：出す前に、画面の端からはみ出さない位置（--dx）を計算してから出す。
// 先に出すと、はみ出した分だけページが一瞬広がり、正しい画面の幅が測れないため
function showTip(info) {
  const tip = info.querySelector('.tip');
  if (!tip) return;
  const W = document.documentElement.clientWidth, m = 8;
  const w = Math.min(250, W - 24);                       // CSS の width と同じ
  const ir = info.getBoundingClientRect();
  const left = ir.left + ir.width / 2 - w * (info.classList.contains('open-right') ? 0.15 : 0.7);
  let dx = 0;
  if (left + w > W - m) dx = W - m - (left + w);
  if (left + dx < m) dx = m - left;
  tip.style.setProperty('--dx', dx + 'px');
  info.classList.add('show');
}
function hideTip(info) {
  if (info.matches(':hover') || info === document.activeElement) return;
  info.classList.remove('show');
}
['mouseover', 'focusin'].forEach(type => document.addEventListener(type, e => {
  const info = e.target.closest?.('.info');
  if (info) showTip(info);
}));
document.addEventListener('mouseout', e => {
  const info = e.target.closest?.('.info');
  if (info && !info.contains(e.relatedTarget)) hideTip(info);
});
document.addEventListener('focusout', e => {
  const info = e.target.closest?.('.info');
  if (info) setTimeout(() => hideTip(info));
});

// 一時停止中などは再描画が止まるので、スクロールや画面サイズの変更でロゴを更新する
let logoFrame = 0;
const refreshLogo = () => {
  if (logoFrame || !active()) return;
  logoFrame = requestAnimationFrame(() => { logoFrame = 0; render(); });
};
addEventListener('scroll', refreshLogo, { passive: true });
addEventListener('resize', refreshLogo);

document.addEventListener('keydown', e => {
  if (e.ctrlKey || e.altKey || e.metaKey) return;          // ブラウザのショートカットは邪魔しない
  if (e.target.matches('input[type=number], input[type=text], input[type=range], select')) return;   // 入力中は無視
  const helpOpen = !$('help').classList.contains('hidden');
  if (e.key === 'Escape' || (helpOpen && e.key === '?')) { toggleHelp(false); return; }
  if (helpOpen) return;
  let handled = true;
  if (e.code === 'Space') {
    state === 'running' ? $('pauseBtn').click() : $('startBtn').click();
  } else if (e.code === 'ArrowLeft' || e.code === 'ArrowRight') {
    seek((e.code === 'ArrowRight' ? 1 : -1) * seekStep());
  } else if (e.code === 'Home') {
    $('restartBtn').click();
  } else if (e.code === 'End' || (e.code === 'KeyS' && !e.shiftKey)) {
    $('skipBtn').click();
  } else if (e.code === 'KeyR' && e.shiftKey) {
    $('resetBtn').click();
  } else if (e.code === 'KeyM' && !e.shiftKey) {
    $('seOn').checked = !$('seOn').checked; readSettings();
  } else if (e.code === 'KeyF' && !e.shiftKey) {
    toggleFullscreen();
  } else if (/^[1-9]$/.test(e.key)) {
    loadFav(+e.key - 1);
  } else if (e.key === '?') {
    toggleHelp(true);
  } else {
    handled = false;
  }
  if (handled) e.preventDefault();
});

$('langSel').addEventListener('change', () => {
  lang = settings.lang = $('langSel').value;
  save(); applyLang(); renderFavs(); render();
});

applyLang();
renderFavs();
buildLogo();
render();
</script>
</body>
</html>
